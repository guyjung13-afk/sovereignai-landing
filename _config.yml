# GitHub Pages build config. The site is plain static HTML/CSS/JS;
# this file only keeps internal tooling and agent docs off the public domain.
include:
  - .well-known
exclude:
  - Agents.md
  - AGENTS.md
  - README.md
  - polish-loop.ps1
  - polish-loop.py
  - polish-loop.sh
  - docs/
  - "*.md"
